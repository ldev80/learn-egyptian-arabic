<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Learn all the important words in Egyptian Arabic!">
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Rubik">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&family=Noto+Sans:ital,wght@0,300;1,300&display=swap" rel="stylesheet">
<title>Learn Egyptian Arabic</title>
<style>
  .hidden {
    opacity: 0;
  }
  body, button {
    font-family: "Noto Sans", sans-serif;
    user-select: none;
  }

  body, html {
    height: 100%;
    background-color: #F4F4EA;
    color: #2B2B35;
    margin: auto;
    text-align: center;
    max-width: 600px;
  }
  .wrapper {
    display: flex;
    flex-direction: column;
    height: 100%;
    margin: 0 1em 0 1em;
  }
  #contents {
    flex:1;
    cursor: default;
    margin:0;
  }
  #emoji-p {
    transition: .2s ease-in-out 0s;
    outline: none;
    user-select: none;
    text-decoration: none;
  }
  #emoji-p:active {
    transform: scale(1.25);
  }
  #reveal {
    margin:0;
  }
  #emoji {
    font-size: 10em;
    text-align: left;
  }
  #english-p {
    font-size: 2em;
    text-align: center;
  }
  #translation-p {
    font-family: "Rubik", sans-serif;
    font-size: 5em;
    text-align: center;
    margin: 0;
  }
  #phonetic-p {
    font-size: 1em;
    color: #D8533D;
    text-align: right;
  }
  .large {
    transition: .2s ease-in-out 0s;
    outline: none;
    user-select: none;
    text-decoration: none;
  }
  .large:active {
    transform: scale(1.25);
  }
  .spread {
    display: flex;
    width:100%;
    box-sizing: border-box;
    justify-content: space-between;
    margin: 0 auto;
    padding: 1em 0;
  }

  /* Hamburger button */
  #menuBtn {
    background: none;
    border: none;
    cursor: pointer;
    padding: 8px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 5px;
  }
  #menuBtn span {
    display: block;
    width: 24px;
    height: 3px;
    background-color: #2B2B35;
    border-radius: 2px;
    transition: .3s ease-in-out;
  }

  /* Side menu overlay */
  #menuOverlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.4);
    opacity: 0;
    visibility: hidden;
    transition: opacity .3s ease, visibility .3s ease;
    z-index: 100;
  }
  #menuOverlay.open {
    opacity: 1;
    visibility: visible;
  }
  #sideMenu {
    position: fixed;
    top: 0;
    right: -280px;
    width: 260px;
    height: 100%;
    background-color: #F4F4EA;
    box-shadow: -4px 0 16px rgba(0,0,0,0.15);
    transition: right .3s ease;
    z-index: 101;
    padding: 1.5em 1em;
    display: flex;
    flex-direction: column;
  }
  #sideMenu.open {
    right: 0;
  }
  #menuClose {
    align-self: flex-end;
    background: none;
    border: none;
    font-size: 1.5em;
    cursor: pointer;
    color: #2B2B35;
    padding: 4px 8px;
    margin-bottom: 1em;
  }
  #sideMenu .menu-title {
    font-size: 1.2em;
    font-weight: bold;
    margin-bottom: 1em;
    text-align: left;
    color: #D8533D;
  }
  #sideMenu .menu-item {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    border-bottom: 1px solid #ddd;
    padding: .9em .5em;
    font-size: 1em;
    font-family: "Noto Sans", sans-serif;
    cursor: pointer;
    color: #2B2B35;
    transition: background .15s ease;
  }
  #sideMenu .menu-item:hover {
    background-color: rgba(216,83,61,0.1);
  }
  #sideMenu .menu-item.active {
    color: #D8533D;
    font-weight: bold;
  }

  /* Category label */
  #categoryLabel {
    font-size: .85em;
    color: #999;
    margin: 0;
  }
</style>
</head>
<body>
  <!-- Side menu overlay -->
  <div id="menuOverlay" onclick="closeMenu()"></div>
  <div id="sideMenu">
    <button id="menuClose" onclick="closeMenu()">✕</button>
    <div class="menu-title">Categories</div>
    <button class="menu-item" onclick="selectSubject(animals, 'Animals')">Animals</button>
    <button class="menu-item" onclick="selectSubject(food, 'Food')">Food</button>
    <button class="menu-item" onclick="selectSubject(places, 'Places')">Places</button>
    <button class="menu-item" onclick="selectSubject(verbs, 'Verbs')">Verbs</button>
    <button class="menu-item" onclick="selectSubject(adverbs, 'Adverbs')">Adverbs</button>
    <button class="menu-item" onclick="selectSubject(prepositions, 'Prepositions')">Prepositions</button>
    <button class="menu-item" onclick="selectSubject(colours, 'Colours')">Colours</button>
    <button class="menu-item" onclick="selectSubject(adjectives, 'Adjectives')">Adjectives</button>
  </div>

  <div class="wrapper">
    <div id="header" class="spread">
      <a href="spanish.html"><img src="images/logo_ar.svg" alt="Lingobud - Arabic" width="48px" height="48px" class="left" style="border-radius: 2em;"></a>
      <p id="categoryLabel">Animals</p>
      <button id="menuBtn" onclick="openMenu()">
        <span></span><span></span><span></span>
      </button>
    </div>
    <div id="contents">
      <div id="emoji-p" onclick="playAudio()"><span id="emoji"></span></div>
      <p id="english-p"><span id="english"></span></p>
    </div>
    <div id="reveal">
      <p id="translation-p"><span id="translation" class="hidden"></span></p>
      <p id="phonetic-p"><span id="phonetic" class="hidden"></span></p>
    </div>
    <div id="footer" class="spread">
      <div class="large" onclick="selectRandomItem()"><img src="images/btn_shuffle.svg" alt="Shuffle" width="80px" height="80px"></div>
      <div class="large" onclick="revealAnswer()" style="margin-right: 0;"><img src="images/btn_reveal.svg" alt="Reveal" width="80px" height="80px"></div>
    </div>
  </div>

var items = animals;
var alarm;

function selectRandomItem() {
  var randomIndex = Math.floor(Math.random() * items.length);
  var selectedItem = items[randomIndex];

  var textContentElements = document.querySelectorAll('.hidden');
  textContentElements.forEach(function(element) {
    element.classList.remove('hidden');
  });

  document.getElementById('emoji').textContent = selectedItem.emoji;
  document.getElementById('english').textContent = selectedItem.english;
  document.getElementById('translation').textContent = selectedItem.translation;
  document.getElementById('phonetic').innerHTML = selectedItem.phonetic;
  document.getElementById('translation').style.opacity = 0;
  document.getElementById('phonetic').style.opacity = 0;
  if (selectedItem.audio) {
    alarm = new Audio('audio/ar/' + selectedItem.audio);
  } else {
    alarm = null;
  }
}

function revealAnswer() {
  document.getElementById('translation').style.opacity = 1;
  document.getElementById('phonetic').style.opacity = 1;
}

function playAudio() {
  if (alarm) alarm.play();
}

function selectSubject(subject, name) {
  items = subject;
  document.getElementById('categoryLabel').textContent = name;
  closeMenu();
  selectRandomItem();

  var menuItems = document.querySelectorAll('#sideMenu .menu-item');
  menuItems.forEach(function(el) {
    el.classList.toggle('active', el.textContent === name);
  });
}

function openMenu() {
  document.getElementById('menuOverlay').classList.add('open');
  document.getElementById('sideMenu').classList.add('open');
}

function closeMenu() {
  document.getElementById('menuOverlay').classList.remove('open');
  document.getElementById('sideMenu').classList.remove('open');
}

selectRandomItem();
</script>
